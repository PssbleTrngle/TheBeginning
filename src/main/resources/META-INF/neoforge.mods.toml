modLoader = "javafml"
loaderVersion = "[1,)"
license = "https://github.com/${repository}"
issueTrackerURL = "https://github.com/${repository}/issues/"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
#logoFile = "${mod_id}/TODO.png"
authors = "possible_triangle"
description = "${mod_description}"
updateJSONURL = "https://api.modrinth.com/updates/the-beginning/forge_updates.json?neoforge=only"
#itemIcon = "${mod_id}:TODO"
#configBackground = "${mod_id}:textures/TODO.png"

[[dependencies.${mod_id}]]
modId="neoforge"
versionRange="[26,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
versionRange = "${minecraft_version_range}"
ordering = "AFTER"
side = "BOTH"
